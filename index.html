<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7b19dc" />
  <title>Mone Cash - Home</title>

  <style>
    :root{
      --primary:#8d20ef;
      --primary-dark:#5c0dbd;
      --orange:#ff7a00;
      --green:#12a628;
      --text:#17213b;
      --muted:#747b89;
      --surface:#ffffff;
      --soft:#f8f4ff;
      --danger:#e53935;
      --success:#159447;
      --shadow:0 16px 40px rgba(51,22,95,.14);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 90% 5%, rgba(142,32,239,.07), transparent 25%),
        #fff;
      display:flex;
      justify-content:center;
    }

    button,
    a{
      -webkit-tap-highlight-color:transparent;
    }

    .app{
      width:100%;
      max-width:500px;
      min-height:100vh;
      padding:14px 16px 108px;
      position:relative;
      overflow:hidden;
      background:#fff;
    }

    .brand{
      display:flex;
      justify-content:center;
      margin:4px 0 14px;
    }

    .brand img{
      width:min(350px,94%);
      height:auto;
      display:block;
      object-fit:contain;
      filter:drop-shadow(0 8px 14px rgba(80,20,150,.08));
    }

    .account-card{
      display:grid;
      grid-template-columns:1.35fr .9fr .9fr;
      gap:10px;
      align-items:center;
      padding:14px;
      border-radius:23px;
      background:#fff;
      box-shadow:var(--shadow);
      margin-bottom:14px;
    }

    .balance-box{
      min-width:0;
      display:flex;
      align-items:center;
      gap:10px;
      padding-right:8px;
    }

    .wallet-image{
      width:64px;
      height:64px;
      flex:0 0 64px;
      object-fit:contain;
    }

    .balance-copy{
      min-width:0;
    }

    .balance-copy small{
      display:block;
      font-size:12px;
      font-weight:800;
      color:#252d45;
      margin-bottom:3px;
      white-space:nowrap;
    }

    .balance-amount{
      font-size:clamp(22px,6vw,31px);
      font-weight:900;
      line-height:1;
      letter-spacing:-.8px;
      white-space:nowrap;
    }

    .quick-btn{
      min-height:76px;
      border:2px solid rgba(255,255,255,.52);
      border-radius:17px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:4px;
      color:#fff;
      font-size:11px;
      font-weight:900;
      cursor:pointer;
      overflow:hidden;
      position:relative;
      box-shadow:0 8px 16px rgba(40,20,80,.16);
      transition:transform .18s ease, filter .2s ease;
    }

    .quick-btn::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.24),transparent 70%);
      transform:translateX(-130%);
      transition:transform .55s ease;
    }

    .quick-btn:hover::after{
      transform:translateX(130%);
    }

    .quick-btn:active{
      transform:scale(.94);
    }

    .quick-btn img{
      width:34px;
      height:34px;
      object-fit:contain;
      filter:brightness(0) invert(1);
    }

    .deposit-btn{
      background:linear-gradient(145deg,#58dc00,#04a00b);
    }

    .withdraw-btn{
      background:linear-gradient(145deg,#a72ff5,#5909bb);
    }

    .winner-row{
      width:100%;
      min-height:44px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      margin:2px 0 8px;
      padding:9px 14px;
      border-radius:15px;
      background:linear-gradient(90deg,#fff6d8,#fff,#f7ecff);
      color:#5d3a00;
      font-size:13px;
      font-weight:850;
      box-shadow:0 8px 22px rgba(90,50,10,.08);
    }

    .winner-row strong{
      color:var(--primary-dark);
    }

    .wheel-area{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      margin-top:3px;
    }

    .wheel-stage{
      width:min(92vw,445px);
      aspect-ratio:1;
      position:relative;
      display:grid;
      place-items:center;
      margin-top:4px;
    }

    .pointer{
      position:absolute;
      top:-3px;
      left:50%;
      width:0;
      height:0;
      transform:translateX(-50%);
      border-left:18px solid transparent;
      border-right:18px solid transparent;
      border-top:0;
      border-bottom:36px solid #ffb300;
      z-index:8;
      filter:drop-shadow(0 4px 3px rgba(0,0,0,.22));
    }

    .pointer::after{
      content:"";
      position:absolute;
      left:-7px;
      top:9px;
      width:14px;
      height:14px;
      background:#fff3a6;
      border-radius:50%;
      box-shadow:0 0 10px rgba(255,255,255,.9);
    }

    .wheel{
      width:100%;
      height:100%;
      border-radius:50%;
      position:relative;
      overflow:hidden;
      transform:rotate(0deg);
      transition:transform 5.6s cubic-bezier(.12,.68,.08,1);
      filter:drop-shadow(0 15px 16px rgba(72,30,12,.22));
      background:
        conic-gradient(
          from -18deg,
          #e91e63 0deg 36deg,
          #0c70d9 36deg 72deg,
          #39b914 72deg 108deg,
          #f35a08 108deg 144deg,
          #7422d5 144deg 180deg,
          #0876dd 180deg 216deg,
          #ff6500 216deg 252deg,
          #36b90e 252deg 288deg,
          #0b70d4 288deg 324deg,
          #7620da 324deg 360deg
        );
    }

    .wheel::before{
      content:"";
      position:absolute;
      inset:2.6%;
      border-radius:50%;
      border:4px solid rgba(255,210,0,.9);
      box-shadow:
        inset 0 0 0 5px rgba(112,55,0,.55),
        inset 0 0 35px rgba(255,255,255,.16);
      z-index:2;
      pointer-events:none;
    }

    .wheel::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.18),transparent 28%);
      pointer-events:none;
      z-index:3;
    }

    .segment-label{
      position:absolute;
      left:50%;
      top:50%;
      width:32%;
      height:50%;
      transform-origin:50% 100%;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding-top:10%;
      z-index:4;
      pointer-events:none;
    }

    .segment-label span{
      color:#fff;
      font-size:clamp(19px,6vw,31px);
      line-height:.92;
      font-weight:950;
      text-align:center;
      text-shadow:0 3px 5px rgba(0,0,0,.35);
    }

    .segment-label small{
      display:block;
      font-size:.6em;
      margin-top:5px;
    }

    .center-button{
      position:absolute;
      z-index:7;
      width:31%;
      aspect-ratio:1;
      border-radius:50%;
      border:5px solid #ffc62f;
      outline:4px solid rgba(120,61,0,.45);
      background:linear-gradient(145deg,#ffe765,#ff9c00);
      color:#6814c7;
      font-size:clamp(23px,7vw,38px);
      font-weight:950;
      cursor:pointer;
      box-shadow:
        0 9px 18px rgba(74,35,0,.28),
        inset 0 4px 7px rgba(255,255,255,.72);
      transition:transform .16s ease, filter .2s ease;
    }

    .center-button:active{
      transform:scale(.92);
    }

    .center-button:disabled{
      cursor:not-allowed;
      filter:grayscale(.25);
      opacity:.8;
    }

    .spin-info{
      margin:10px 0 0;
      padding:8px 14px;
      border-radius:99px;
      background:#faf6ff;
      color:#5d2ba0;
      font-size:13px;
      font-weight:850;
      box-shadow:0 6px 16px rgba(80,30,140,.07);
    }

    .bottom-nav{
      position:fixed;
      left:50%;
      bottom:14px;
      transform:translateX(-50%);
      width:min(468px,calc(100% - 24px));
      min-height:76px;
      padding:7px 8px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:5px;
      background:rgba(255,255,255,.95);
      border-radius:23px;
      box-shadow:0 15px 38px rgba(36,20,65,.2);
      backdrop-filter:blur(12px);
      z-index:30;
    }

    .nav-item{
      border:2px solid transparent;
      border-radius:17px;
      background:transparent;
      color:#5f6674;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2px;
      font-size:11px;
      font-weight:900;
      text-decoration:none;
      cursor:pointer;
      transition:transform .16s ease, background .2s ease, border-color .2s ease;
    }

    .nav-item svg{
      width:28px;
      height:28px;
      fill:none;
      stroke:currentColor;
      stroke-width:2.1;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .nav-item:active{
      transform:scale(.93);
    }

    .nav-item.active{
      color:var(--primary-dark);
      border-color:#b852f5;
      background:#fbf6ff;
    }

    .nav-item.invite{
      color:#f26a00;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:106px;
      transform:translate(-50%,120px);
      width:min(420px,calc(100% - 32px));
      padding:14px 16px;
      border-radius:14px;
      color:#fff;
      font-size:14px;
      font-weight:850;
      text-align:center;
      opacity:0;
      pointer-events:none;
      z-index:100;
      box-shadow:0 14px 30px rgba(0,0,0,.2);
      transition:transform .3s ease, opacity .3s ease;
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    .toast.success{background:var(--success)}
    .toast.error{background:var(--danger)}

    @media(max-width:390px){
      .app{
        padding-left:11px;
        padding-right:11px;
      }

      .account-card{
        padding:10px;
        gap:7px;
      }

      .wallet-image{
        width:54px;
        height:54px;
        flex-basis:54px;
      }

      .quick-btn{
        min-height:68px;
      }

      .quick-btn img{
        width:29px;
        height:29px;
      }
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="brand">
      <img src="images/24091-removebg-preview.png" alt="Mone Cash" />
    </div>

    <section class="account-card">
      <div class="balance-box">
        <img
          class="wallet-image"
          src="images/wallet-icon.png"
          alt="Wallet"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
        />
        <div style="display:none;font-size:48px" aria-hidden="true">👛</div>

        <div class="balance-copy">
          <small>Wallet Balance</small>
          <div class="balance-amount">₹<span id="balanceAmount">0.00</span></div>
        </div>
      </div>

      <button id="depositBtn" class="quick-btn deposit-btn" type="button">
        <img src="images/IMG_20260724_194326.png" alt="" onerror="this.style.display='none'" />
        <span>DEPOSIT</span>
      </button>

      <button id="withdrawBtn" class="quick-btn withdraw-btn" type="button">
        <img src="images/IMG_20260724_194411.png" alt="" onerror="this.style.display='none'" />
        <span>WITHDRAWAL</span>
      </button>
    </section>

    <div class="winner-row">
      🎉 Recent winner:
      <strong id="winnerName">Rahul</strong>
      won
      <strong id="winnerAmount">₹50</strong>
    </div>

    <section class="wheel-area">
      <div class="wheel-stage">
        <div class="pointer" aria-hidden="true"></div>

        <div id="wheel" class="wheel" aria-label="Reward wheel">
          <div class="segment-label" style="transform:translate(-50%,-100%) rotate(0deg)">
            <span style="transform:rotate(0deg)">10<small>₹</small></span>
          </div>
          <div class="segment-label" style="transform:translate(-50%,-100%) rotate(36deg)">
            <span style="transform:rotate(-36deg)">20<small>₹</small></span>
          </div>
          <div class="segment-label" style="transform:translate(-50%,-100%) rotate(72deg)">
            <span style="transform:rotate(-72deg)">25<small>₹</small></span>
          </div>
          <div class="segment-label" style="transform:translate(-50%,-100%) rotate(108deg)">
            <span style="transform:rotate(-108deg)">9<small>₹</small></span>
          </div>
          <div class="segment-label" style="transform:translate(-50%,-100%) rotate(144deg)">
            <span style="transform:rotate(-144deg)">50<small>₹</small></span>
          </div>
          <div class="segment-label" style="transform:translate(-50%,-100%) rotate(180deg)">
            <span style="transform:rotate(-180deg)">46<small>₹</small></span>
          </div>
          <div class="segment-label" style="transform:translate(-50%,-100%) rotate(216deg)">
            <span style="transform:rotate(-216deg)">17<small>₹</small></span>
          </div>
          <div class="segment-label" style="transform:translate(-50%,-100%) rotate(252deg)">
            <span style="transform:rotate(-252deg)">8<small>₹</small></span>
          </div>
          <div class="segment-label" style="transform:translate(-50%,-100%) rotate(288deg)">
            <span style="transform:rotate(-288deg)">6<small>₹</small></span>
          </div>
          <div class="segment-label" style="transform:translate(-50%,-100%) rotate(324deg)">
            <span style="transform:rotate(-324deg)">120<small>₹</small></span>
          </div>
        </div>

        <button id="spinBtn" class="center-button" type="button">SPIN</button>
      </div>

      <div class="spin-info">Demo spin cost: ₹20</div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Bottom navigation">
    <a class="nav-item" href="profile.html">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path>
      </svg>
      <span>PROFILE</span>
    </a>

    <a class="nav-item active" href="index.html">
      <svg viewBox="0 0 24 24">
        <path d="m3 11 9-8 9 8"></path>
        <path d="M5 10v11h14V10"></path>
        <path d="M9 21v-6h6v6"></path>
      </svg>
      <span>HOME</span>
    </a>

    <a class="nav-item invite" href="invite.html">
      <svg viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3"></circle>
        <circle cx="17" cy="9" r="2.5"></circle>
        <path d="M3.5 21a5.5 5.5 0 0 1 11 0"></path>
        <path d="M14 15.5a4.5 4.5 0 0 1 6.5 4"></path>
      </svg>
      <span>INVITE</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import {
      auth,
      db,
      USERS_COLLECTION,
      SPIN_HISTORY_COLLECTION
    } from "./firebase-config.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
      doc,
      getDoc,
      runTransaction,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const DEMO_SPIN_COST = 20;
    const rewards = [10, 20, 25, 9, 50, 46, 17, 8, 6, 120];
    const names = [
      "Rahul", "Aman", "Priya", "Arjun", "Neha",
      "Vikas", "Rohit", "Sana", "Karan", "Pooja"
    ];

    const balanceAmount = document.getElementById("balanceAmount");
    const spinBtn = document.getElementById("spinBtn");
    const wheel = document.getElementById("wheel");
    const toast = document.getElementById("toast");
    const winnerName = document.getElementById("winnerName");
    const winnerAmount = document.getElementById("winnerAmount");
    const depositBtn = document.getElementById("depositBtn");
    const withdrawBtn = document.getElementById("withdrawBtn");

    let currentUser = null;
    let currentBalance = 0;
    let currentRotation = 0;
    let spinning = false;

    function showToast(message, type = "success") {
      toast.textContent = message;
      toast.className = `toast ${type} show`;

      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3300);
    }

    function formatBalance(value) {
      return Number(value || 0).toFixed(2);
    }

    function updateBalanceUI(value) {
      currentBalance = Number(value || 0);
      balanceAmount.textContent = formatBalance(currentBalance);
    }

    function rotateWinnerTicker() {
      const randomName = names[Math.floor(Math.random() * names.length)];
      const randomReward = rewards[Math.floor(Math.random() * rewards.length)];

      winnerName.textContent = randomName;
      winnerAmount.textContent = `₹${randomReward}`;
    }

    setInterval(rotateWinnerTicker, 3500);

    async function loadUserBalance(user) {
      const userRef = doc(db, USERS_COLLECTION, user.uid);
      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {
        showToast("User profile was not found.", "error");
        return;
      }

      const userData = userSnap.data();

      if (userData.accountStatus === "blocked") {
        showToast("Your account is blocked.", "error");
        return;
      }

      updateBalanceUI(userData.balance || 0);
    }

    function calculateRotation(selectedIndex) {
      const segmentAngle = 360 / rewards.length;
      const segmentCenter = selectedIndex * segmentAngle + segmentAngle / 2;

      const extraRounds = 6 + Math.floor(Math.random() * 3);
      const targetRotation = extraRounds * 360 + (360 - segmentCenter);

      currentRotation += targetRotation;
      return currentRotation;
    }

    async function processSpin(selectedIndex, reward) {
      const userRef = doc(db, USERS_COLLECTION, currentUser.uid);

      const newBalance = await runTransaction(db, async (transaction) => {
        const userSnap = await transaction.get(userRef);

        if (!userSnap.exists()) {
          throw new Error("user-not-found");
        }

        const data = userSnap.data();
        const balance = Number(data.balance || 0);

        if (balance < DEMO_SPIN_COST) {
          throw new Error("insufficient-balance");
        }

        const updatedBalance = balance - DEMO_SPIN_COST + reward;

        transaction.update(userRef, {
          balance: updatedBalance,
          totalEarnings: Number(data.totalEarnings || 0) + reward,
          updatedAt: serverTimestamp()
        });

        return updatedBalance;
      });

      await addDoc(collection(db, SPIN_HISTORY_COLLECTION), {
        userId: currentUser.uid,
        email: currentUser.email || "",
        spinCost: DEMO_SPIN_COST,
        reward: reward,
        segmentIndex: selectedIndex,
        balanceAfter: newBalance,
        type: "demo_spin",
        createdAt: serverTimestamp()
      });

      return newBalance;
    }

    spinBtn.addEventListener("click", async () => {
      if (spinning || !currentUser) {
        return;
      }

      if (currentBalance < DEMO_SPIN_COST) {
        showToast("Minimum ₹20 demo balance is required.", "error");
        return;
      }

      spinning = true;
      spinBtn.disabled = true;
      spinBtn.textContent = "...";

      const selectedIndex = Math.floor(Math.random() * rewards.length);
      const reward = rewards[selectedIndex];
      const rotation = calculateRotation(selectedIndex);

      wheel.style.transform = `rotate(${rotation}deg)`;

      try {
        const newBalance = await processSpin(selectedIndex, reward);

        setTimeout(() => {
          updateBalanceUI(newBalance);
          spinBtn.textContent = "SPIN";
          spinBtn.disabled = false;
          spinning = false;

          showToast(
            `₹${DEMO_SPIN_COST} cost deducted. You received ₹${reward}.`,
            "success"
          );
        }, 5700);
      } catch (error) {
        console.error("Spin error:", error);

        setTimeout(() => {
          spinBtn.textContent = "SPIN";
          spinBtn.disabled = false;
          spinning = false;

          if (error.message === "insufficient-balance") {
            showToast("Your demo balance is below ₹20.", "error");
          } else if (
            error.code === "permission-denied" ||
            error.code === "firestore/permission-denied"
          ) {
            showToast("Firestore rules blocked the spin.", "error");
          } else {
            showToast("Spin failed. Please try again.", "error");
          }
        }, 600);
      }
    });

    depositBtn.addEventListener("click", () => {
      window.location.href = "deposit.html";
    });

    withdrawBtn.addEventListener("click", () => {
      window.location.href = "withdrawal.html";
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.replace("login.html");
        return;
      }

      currentUser = user;

      try {
        await loadUserBalance(user);
      } catch (error) {
        console.error("Balance load error:", error);
        showToast("Could not load wallet balance.", "error");
      }
    });
  </script>
</body>
</html>
