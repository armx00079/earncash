<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdrawal History</title>
<style>
:root{
  --primary:#6c12d8;
  --primary2:#922af1;
  --text:#141a32;
  --muted:#6f7482;
  --line:#e9e4f1;
  --soft:#f8f3ff;
  --success:#159447;
  --danger:#df2443;
  --warning:#e89b08;
  --shadow:0 12px 30px rgba(52,24,95,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:#fff;
}
button,a,input{font:inherit;-webkit-tap-highlight-color:transparent}
.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:0 auto;
  padding-bottom:28px;
  background:#fff;
}
.topbar{
  min-height:76px;
  padding:0 16px;
  display:grid;
  grid-template-columns:44px 1fr 44px;
  align-items:center;
  color:#fff;
  background:linear-gradient(110deg,#4710a2,#851ce3);
  position:sticky;
  top:0;
  z-index:20;
}
.topbar h1{text-align:center;font-size:22px;font-weight:900}
.top-btn{
  width:40px;height:40px;border:0;border-radius:50%;background:transparent;
  color:#fff;font-size:30px;display:grid;place-items:center;cursor:pointer;
  transition:transform .15s ease
}
.top-btn:active{transform:scale(.9)}
.content{padding:18px}
.summary-card,.filter-card,.empty-card,.record-card,.invite-card,.stats-card,.how-card,.note-card{
  border:1px solid var(--line);
  border-radius:20px;
  background:#fff;
  box-shadow:var(--shadow);
}
.summary-card{
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
}
.summary-card small{color:var(--muted)}
.summary-card strong{display:block;font-size:28px;margin-top:5px}
.summary-icon{
  width:58px;height:58px;border-radius:16px;background:linear-gradient(145deg,#eee3ff,#fbf8ff);
  color:var(--primary);display:grid;place-items:center;font-size:28px
}
.filter-card{
  margin-top:16px;
  padding:12px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.filter-btn{
  min-height:42px;border:1.5px solid var(--line);border-radius:12px;background:#fff;
  color:var(--muted);font-size:12px;font-weight:850;cursor:pointer;transition:.18s ease
}
.filter-btn.active{color:#fff;border-color:transparent;background:linear-gradient(100deg,var(--primary2),var(--primary))}
.filter-btn:active{transform:scale(.95)}
.record-list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.record-card{padding:16px}
.record-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.record-title{font-size:16px;font-weight:900}
.order-id{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-all}
.status{
  flex:0 0 auto;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:900
}
.status.pending{background:#fff5dc;color:#b36b00}
.status.approved{background:#e9fbef;color:#13873f}
.status.rejected{background:#ffecef;color:#cf2441}
.record-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px;padding-top:14px;
  border-top:1px solid var(--line)
}
.data-label{font-size:12px;color:var(--muted)}
.data-value{font-size:15px;font-weight:850;margin-top:4px;word-break:break-word}
.empty-card{padding:38px 20px;text-align:center;margin-top:16px}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-card h3{font-size:20px}.empty-card p{color:var(--muted);font-size:14px;margin-top:7px}
.invite-card{
  padding:24px 20px;
  text-align:center;
  background:
   radial-gradient(circle at 85% 15%,rgba(255,255,255,.2),transparent 22%),
   linear-gradient(120deg,#8a22eb,#4f08b5);
  color:#fff;
}
.gift{font-size:55px}
.invite-card h2{font-size:29px;margin-top:8px}
.invite-card p{opacity:.88;margin-top:8px;line-height:1.5}
.reward-box{
  margin-top:17px;padding:16px;border:1px solid rgba(255,255,255,.35);
  border-radius:16px;background:rgba(255,255,255,.12)
}
.reward-box strong{font-size:36px;color:#ffd23d}
.code-card{padding:18px;margin-top:16px}
.code-label{font-size:13px;color:var(--muted);text-align:center}
.code-row{
  min-height:60px;border:1.5px dashed #bd8eea;border-radius:14px;margin-top:10px;
  display:flex;align-items:center;gap:10px;padding:0 12px;background:#fcf9ff
}
.code-row strong{flex:1;font-size:21px;letter-spacing:1px;color:var(--primary);overflow:hidden;text-overflow:ellipsis}
.copy-btn,.share-btn{
  border:1.5px solid var(--primary);border-radius:11px;background:#fff;color:var(--primary);
  font-weight:900;padding:10px 14px;cursor:pointer;transition:.16s ease
}
.copy-btn:active,.share-btn:active{transform:scale(.95)}
.share-btn{
  width:100%;min-height:58px;margin-top:14px;color:#fff;border-color:transparent;
  background:linear-gradient(100deg,var(--primary2),var(--primary));font-size:18px
}
.note-card{padding:16px;margin-top:16px;background:#fffaf0;border-color:#efdca5;color:#744c00;line-height:1.55;font-size:14px}
.note-card b{color:#5e09bd}
.stats-card{
  margin-top:16px;
  padding:16px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  text-align:center
}
.stats-card>div:not(:last-child){border-right:1px solid var(--line)}
.stats-card small{display:block;color:var(--muted);font-size:12px}
.stats-card strong{display:block;color:var(--primary);font-size:22px;margin-top:5px}
.how-card{padding:18px;margin-top:16px}
.how-card h3{color:var(--primary);font-size:19px}
.step{display:flex;gap:12px;margin-top:15px}
.step-num{
  width:34px;height:34px;flex:0 0 34px;border-radius:50%;
  background:linear-gradient(145deg,var(--primary2),var(--primary));color:#fff;
  display:grid;place-items:center;font-weight:900
}
.step b{display:block}.step p{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.45}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,100px);opacity:0;
  width:min(420px,calc(100% - 30px));padding:14px 16px;border-radius:13px;
  background:var(--success);color:#fff;text-align:center;font-weight:850;z-index:100;
  transition:.25s ease
}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:var(--danger)}
.loading{text-align:center;color:var(--muted);padding:30px 0}
@media(max-width:430px){
  .content{padding:14px}.topbar{min-height:68px}.topbar h1{font-size:20px}
  .filter-card{grid-template-columns:repeat(2,1fr)}
  .record-grid{grid-template-columns:1fr 1fr}
  .stats-card strong{font-size:18px}
}
</style>
</head>
<body><main class="app">
<header class="topbar"><button class="top-btn" onclick="history.back()">←</button><h1>Withdrawal History</h1><span></span></header>
<div class="content">
<section class="summary-card">
  <div><small>Total Records</small><strong id="totalCount">0</strong><small>Total Amount: <b id="totalAmount">₹0.00</b></small></div>
  <div class="summary-icon">⬆️</div>
</section>
<section class="filter-card">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="pending">Pending</button>
  <button class="filter-btn" data-filter="approved">Approved</button>
  <button class="filter-btn" data-filter="rejected">Rejected</button>
</section>
<div id="loading" class="loading">Loading records...</div>
<section id="recordList" class="record-list"></section>
<section id="emptyState" class="empty-card" style="display:none">
  <div class="empty-icon">⬆️</div><h3>No records found</h3><p>Your withdrawal requests will appear here.</p>
</section>
</div></main>
<script type="module">
import { auth, db, USERS_COLLECTION, WITHDRAW_COLLECTION } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {
  collection, query, where, orderBy, onSnapshot, getDocs, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const list = document.getElementById("recordList");
const loading = document.getElementById("loading");
const empty = document.getElementById("emptyState");
const totalAmount = document.getElementById("totalAmount");
const totalCount = document.getElementById("totalCount");
const filterButtons = document.querySelectorAll(".filter-btn");

let allRecords = [];
let activeFilter = "all";

function money(value){
  return `₹${Number(value || 0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
}
function dateText(value){
  try{
    const d = value?.toDate ? value.toDate() : new Date(value);
    if(Number.isNaN(d.getTime())) return "Not available";
    return d.toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  }catch{return "Not available";}
}
function safe(value,fallback="-"){ return value ?? fallback; }

function render(){
  const rows = activeFilter === "all"
    ? allRecords
    : allRecords.filter(item => String(item.status || "pending").toLowerCase() === activeFilter);

  list.innerHTML = "";
  loading.style.display = "none";
  empty.style.display = rows.length ? "none" : "block";

  rows.forEach(item => {
    const status = String(item.status || "pending").toLowerCase();
    const card = document.createElement("article");
    card.className = "record-card";
    card.innerHTML = `
<div class="record-head">
  <div>
    <div class="record-title">${safe(item.method || item.withdrawMethod || "Withdrawal")}</div>
    <div class="order-id">Order ID: ${safe(item.orderId || item.id)}</div>
  </div>
  <span class="status ${status}">${status.toUpperCase()}</span>
</div>
<div class="record-grid">
  <div><div class="data-label">Amount</div><div class="data-value">${money(item.amount)}</div></div>
  <div><div class="data-label">Date & Time</div><div class="data-value">${dateText(item.createdAt)}</div></div>
  <div><div class="data-label">Account / UPI</div><div class="data-value">${safe(item.upiId || item.accountNumber || item.paymentAddress)}</div></div>
  <div><div class="data-label">Admin Note</div><div class="data-value">${safe(item.adminNote || item.rejectReason,"No note")}</div></div>
</div>`;
    list.appendChild(card);
  });

  totalCount.textContent = allRecords.length;
  totalAmount.textContent = money(
    allRecords.reduce((sum,item)=>sum + Number(item.amount || item.amountInr || 0),0)
  );
}

filterButtons.forEach(button=>{
  button.addEventListener("click",()=>{
    filterButtons.forEach(x=>x.classList.remove("active"));
    button.classList.add("active");
    activeFilter = button.dataset.filter;
    render();
  });
});

onAuthStateChanged(auth, async user=>{
  if(!user){ location.replace("login.html"); return; }

  const base = collection(db, WITHDRAW_COLLECTION);

  try{
    const q = query(base, where("userId","==",user.uid), orderBy("createdAt","desc"));
    onSnapshot(q,snap=>{
      allRecords = snap.docs.map(d=>({id:d.id,...d.data()}));
      render();
    }, async error=>{
      console.warn("Primary query failed:",error);
      const fallback = query(base, where("userId","==",user.uid));
      const snap = await getDocs(fallback);
      allRecords = snap.docs.map(d=>({id:d.id,...d.data()}))
        .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
      render();
    });
  }catch(error){
    console.error(error);
    loading.style.display="none";
    empty.style.display="block";
  }
});
</script>
</body></html>
