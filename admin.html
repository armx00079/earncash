<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>RozanaCash Admin Panel</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#eef2ff;

color:#222;

min-height:100vh;

}

header{

background:linear-gradient(135deg,#5e239d,#7b2cbf);

padding:18px;

color:#fff;

font-size:22px;

font-weight:700;

text-align:center;

box-shadow:0 8px 20px rgba(0,0,0,.15);

position:sticky;

top:0;

z-index:999;

}

.container{

width:95%;

max-width:1400px;

margin:auto;

padding:20px;

}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:18px;

margin-bottom:22px;

}

.card{

background:#fff;

border-radius:18px;

padding:18px;

box-shadow:
0 10px 25px rgba(0,0,0,.08);

transition:.3s;

}

.card:hover{

transform:translateY(-4px);

}

.card h3{

font-size:15px;

color:#666;

margin-bottom:10px;

}

.card h1{

font-size:32px;

font-weight:700;

color:#5e239d;

}

.section{

background:#fff;

border-radius:18px;

padding:20px;

margin-top:22px;

box-shadow:
0 10px 25px rgba(0,0,0,.08);

}

.section-title{

font-size:20px;

font-weight:700;

margin-bottom:18px;

color:#5e239d;

display:flex;

align-items:center;

gap:8px;

}

.grid2{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(260px,1fr));

gap:18px;

}

.input-group{

display:flex;

flex-direction:column;

gap:8px;

}

.input-group label{

font-size:14px;

font-weight:600;

color:#555;

}

.input-group input{

height:48px;

padding:12px;

border-radius:12px;

border:1px solid #ddd;

outline:none;

font-size:15px;

transition:.3s;

}

.input-group input:focus{

border-color:#5e239d;

box-shadow:
0 0 0 3px rgba(94,35,157,.15);

}

.saveBtn{

margin-top:20px;

background:#5e239d;

color:#fff;

border:none;

height:50px;

width:100%;

border-radius:14px;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

.saveBtn:hover{

background:#4b1d80;

}

.searchBox{

margin-bottom:18px;

}

.searchBox input{

width:100%;

height:48px;

padding:12px;

border-radius:12px;

border:1px solid #ddd;

font-size:15px;

outline:none;

}
  .table{

width:100%;

border-collapse:collapse;

margin-top:15px;

}

.table th{

background:#5e239d;

color:#fff;

padding:14px;

font-size:14px;

text-align:left;

}

.table td{

padding:14px;

border-bottom:1px solid #eee;

font-size:14px;

}

.badge{

display:inline-block;

padding:6px 12px;

border-radius:30px;

font-size:12px;

font-weight:600;

}

.pending{

background:#fff4d6;

color:#d68910;

}

.approved{

background:#d5f5e3;

color:#239b56;

}

.rejected{

background:#fadbd8;

color:#c0392b;

}

.actionBtn{

border:none;

padding:10px 18px;

border-radius:10px;

cursor:pointer;

font-size:13px;

font-weight:600;

margin-right:8px;

transition:.25s;

}

.approveBtn{

background:#2ecc71;

color:white;

}

.rejectBtn{

background:#e74c3c;

color:white;

}

.editBtn{

background:#5e239d;

color:white;

}

.actionBtn:hover{

transform:scale(.97);

}

.userCard{

background:#fafafa;

border:1px solid #ececec;

border-radius:14px;

padding:15px;

margin-bottom:12px;

}

.userTitle{

font-size:16px;

font-weight:700;

color:#5e239d;

margin-bottom:8px;

}

.userInfo{

font-size:14px;

color:#555;

line-height:1.8;

}

.flex{

display:flex;

gap:10px;

flex-wrap:wrap;

}

.stat{

background:#f8f7ff;

border-radius:12px;

padding:14px;

text-align:center;

flex:1;

min-width:120px;

}

.stat h2{

color:#5e239d;

font-size:24px;

margin-bottom:4px;

}

.stat p{

font-size:13px;

color:#666;

}

@media(max-width:768px){

header{

font-size:18px;

padding:15px;

}

.card h1{

font-size:26px;

}

.section{

padding:16px;

}

.table{

display:block;

overflow-x:auto;

white-space:nowrap;

}

}

</style>

</head>

<body>

<header>

👑 RozanaCash Admin Panel

</header>

<div class="container">

<div class="cards">

<div class="card">

<h3>Total Users</h3>

<h1 id="totalUsers">0</h1>

</div>

<div class="card">

<h3>Total Deposit</h3>

<h1 id="totalDeposit">₹0</h1>

</div>

<div class="card">

<h3>Pending Deposit</h3>

<h1 id="pendingDeposit">0</h1>

</div>

<div class="card">

<h3>Pending Withdraw</h3>

<h1 id="pendingWithdraw">0</h1>

</div>

</div>

<input

<input

<div class="input-group">

<input

id="dailyUserMaxWin">

<div class="input-group">
<label>Small Win Min</label>
<input
type="number"
id="smallWinMin">
</div>

<div class="input-group">
<label>Small Win Max</label>
<input
type="number"
id="smallWinMax">
</div>

<div class="input-group">
<label>Medium Win Min</label>
<input
type="number"
id="mediumWinMin">
</div>

<div class="input-group">
<label>Medium Win Max</label>
<input
type="number"
id="mediumWinMax">
</div>

<div class="input-group">
<label>Big Win Min</label>
<input
type="number"
id="bigWinMin">
</div>

<div class="input-group">
<label>Big Win Max</label>
<input
type="number"
id="bigWinMax">
</div>

<div class="input-group">
<label>Small Win Chance (%)</label>
<input
type="number"
id="smallWinChance">
</div>

<div class="input-group">
<label>Medium Win Chance (%)</label>
<input
type="number"
id="mediumWinChance">
</div>

<div class="input-group">
<label>Big Win Chance (%)</label>
<input
type="number"
id="bigWinChance">
</div>

</div>

<button
class="saveBtn"
id="saveSpinSettings">

💾 Save Spin Settings

</button>

</div>

<div class="section">

<div class="section-title">

🏧 Withdraw Control

</div>

<div
