<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6c22d9" />
  <title>Mone Cash - Create Account</title>

  <style>
    :root{
      --primary:#8f2df5;
      --primary-dark:#5511be;
      --orange:#ff8a00;
      --text:#20283a;
      --muted:#777b86;
      --border:#e6e6ee;
      --surface:#ffffff;
      --soft:#f8f5ff;
      --danger:#e53935;
      --success:#168a45;
      --shadow:0 18px 60px rgba(78,35,135,.12);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(143,45,245,.08), transparent 26%),
        radial-gradient(circle at 90% 15%, rgba(255,138,0,.09), transparent 24%),
        #fff;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:18px;
    }

    .app-shell{
      width:100%;
      max-width:470px;
      min-height:calc(100vh - 36px);
      background:rgba(255,255,255,.96);
      border:1px solid rgba(225,225,235,.9);
      border-radius:26px;
      box-shadow:var(--shadow);
      padding:26px 22px 30px;
      overflow:hidden;
      position:relative;
    }

    .app-shell::before{
      content:"";
      position:absolute;
      width:180px;
      height:180px;
      border-radius:50%;
      background:rgba(143,45,245,.055);
      top:-95px;
      right:-85px;
      pointer-events:none;
    }

    .brand{
      display:flex;
      justify-content:center;
      align-items:center;
      margin:8px 0 22px;
      position:relative;
      z-index:1;
    }

    .brand img{
      width:min(330px, 88%);
      height:auto;
      display:block;
      object-fit:contain;
      filter:drop-shadow(0 8px 12px rgba(95,30,180,.08));
    }

    .heading{
      text-align:center;
      margin-bottom:24px;
    }

    .heading h1{
      font-size:clamp(30px, 7vw, 40px);
      line-height:1.15;
      font-weight:800;
      letter-spacing:-1px;
      margin-bottom:10px;
    }

    .heading p{
      color:var(--muted);
      font-size:16px;
      line-height:1.5;
    }

    .form{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .field{
      position:relative;
    }

    .field-box{
      min-height:68px;
      border:1.5px solid var(--border);
      border-radius:17px;
      display:flex;
      align-items:center;
      padding:0 14px;
      background:#fff;
      transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    .field-box:focus-within{
      border-color:var(--primary);
      box-shadow:0 0 0 4px rgba(143,45,245,.1);
      transform:translateY(-1px);
    }

    .icon-box{
      width:44px;
      height:44px;
      flex:0 0 44px;
      border-radius:12px;
      background:linear-gradient(145deg, #f0eaff, #fbfaff);
      display:grid;
      place-items:center;
      margin-right:12px;
    }

    .icon-box svg,
    .eye-btn svg{
      width:23px;
      height:23px;
      fill:none;
      stroke:#656975;
      stroke-width:1.9;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .field input{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-size:16px;
      min-width:0;
    }

    .field input::placeholder{
      color:#9396a0;
    }

    .eye-btn{
      width:42px;
      height:42px;
      flex:0 0 42px;
      display:grid;
      place-items:center;
      border:1px solid transparent;
      border-radius:12px;
      background:transparent;
      cursor:pointer;
      transition:transform .15s ease, background .2s ease, border-color .2s ease;
    }

    .eye-btn:hover{
      background:#f6f1ff;
      border-color:#e5d8ff;
    }

    .eye-btn:active{
      transform:scale(.9);
    }

    .error-text{
      min-height:18px;
      margin:6px 5px 0;
      color:var(--danger);
      font-size:12px;
      display:none;
    }

    .field.invalid .field-box{
      border-color:var(--danger);
      box-shadow:0 0 0 4px rgba(229,57,53,.08);
    }

    .field.invalid .error-text{
      display:block;
    }

    .register-btn{
      min-height:62px;
      margin-top:8px;
      border:2px solid transparent;
      border-radius:17px;
      background:linear-gradient(100deg, var(--primary), var(--primary-dark));
      color:#fff;
      font-size:18px;
      font-weight:800;
      letter-spacing:.2px;
      cursor:pointer;
      position:relative;
      overflow:hidden;
      box-shadow:0 12px 24px rgba(92,19,190,.24);
      transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    .register-btn::before{
      content:"";
      position:absolute;
      top:0;
      left:-120%;
      width:70%;
      height:100%;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
      transform:skewX(-20deg);
      transition:left .55s ease;
    }

    .register-btn:hover::before{
      left:145%;
    }

    .register-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 16px 30px rgba(92,19,190,.28);
    }

    .register-btn:active{
      transform:scale(.97);
    }

    .register-btn:disabled{
      cursor:not-allowed;
      opacity:.72;
      filter:grayscale(.15);
      transform:none;
    }

    .btn-content{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      position:relative;
      z-index:1;
    }

    .spinner{
      width:20px;
      height:20px;
      border-radius:50%;
      border:3px solid rgba(255,255,255,.35);
      border-top-color:#fff;
      animation:spin .75s linear infinite;
      display:none;
    }

    .register-btn.loading .spinner{
      display:block;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    .divider{
      display:flex;
      align-items:center;
      gap:14px;
      margin:27px 0 22px;
      color:#626671;
      font-weight:600;
    }

    .divider::before,
    .divider::after{
      content:"";
      height:1px;
      background:#e7e7ed;
      flex:1;
    }

    .login-text{
      text-align:center;
      color:#666a74;
      font-size:15px;
    }

    .login-text a{
      color:var(--primary);
      font-weight:800;
      text-decoration:none;
      position:relative;
    }

    .login-text a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:-3px;
      height:2px;
      width:0;
      background:var(--primary);
      transition:width .2s ease;
    }

    .login-text a:hover::after{
      width:100%;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translate(-50%, 120px);
      width:min(420px, calc(100% - 32px));
      padding:14px 16px;
      border-radius:14px;
      color:#fff;
      font-size:14px;
      font-weight:700;
      text-align:center;
      opacity:0;
      pointer-events:none;
      z-index:50;
      transition:transform .3s ease, opacity .3s ease;
      box-shadow:0 14px 30px rgba(0,0,0,.18);
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%, 0);
    }

    .toast.success{background:var(--success)}
    .toast.error{background:var(--danger)}

    @media (max-width:520px){
      body{
        padding:0;
        background:#fff;
      }

      .app-shell{
        max-width:none;
        min-height:100vh;
        border:0;
        border-radius:0;
        box-shadow:none;
        padding:22px 18px 28px;
      }

      .brand{
        margin-top:2px;
      }

      .field-box{
        min-height:64px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      *, *::before, *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <div class="brand">
      <img src="images/24091-removebg-preview.png" alt="Mone Cash" />
    </div>

    <section class="heading">
      <h1>Create Account</h1>
      <p>Join Mone Cash and start earning</p>
    </section>

    <form id="registerForm" class="form" novalidate>
      <div class="field" id="emailField">
        <div class="field-box">
          <div class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m3 7 9 7 9-7"></path>
            </svg>
          </div>
          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="Gmail"
            maxlength="120"
            required
          />
        </div>
        <div class="error-text">Please enter a valid Gmail address.</div>
      </div>

      <div class="field" id="passwordField">
        <div class="field-box">
          <div class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="5" y="10" width="14" height="11" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
              <path d="M12 14v3"></path>
            </svg>
          </div>
          <input
            id="password"
            type="password"
            autocomplete="new-password"
            placeholder="Password"
            minlength="6"
            maxlength="60"
            required
          />
          <button class="eye-btn" type="button" data-toggle="password" aria-label="Show password">
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="2.8"></circle>
            </svg>
          </button>
        </div>
        <div class="error-text">Password must be at least 6 characters.</div>
      </div>

      <div class="field" id="confirmPasswordField">
        <div class="field-box">
          <div class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="5" y="10" width="14" height="11" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
              <path d="M12 14v3"></path>
            </svg>
          </div>
          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Confirm Password"
            minlength="6"
            maxlength="60"
            required
          />
          <button class="eye-btn" type="button" data-toggle="confirmPassword" aria-label="Show confirm password">
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="2.8"></circle>
            </svg>
          </button>
        </div>
        <div class="error-text">Both passwords must be the same.</div>
      </div>

      <div class="field" id="inviteField">
        <div class="field-box">
          <div class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path>
            </svg>
          </div>
          <input
            id="inviteCode"
            type="text"
            autocomplete="off"
            placeholder="Invite Code (Optional)"
            maxlength="20"
          />
        </div>
        <div class="error-text">This invite code is not valid.</div>
      </div>

      <button id="registerBtn" class="register-btn" type="submit">
        <span class="btn-content">
          <span class="spinner" aria-hidden="true"></span>
          <span id="buttonText">Register</span>
        </span>
      </button>
    </form>

    <div class="divider">OR</div>

    <p class="login-text">
      Already have an account?
      <a href="login.html">Login</a>
    </p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module">
    /*
      FIREBASE SETUP:
      1. Firebase Console > Project Settings > Your apps > Web app.
      2. Copy your firebaseConfig and replace the values below.
      3. Firebase Authentication > Sign-in method > Enable Email/Password.
      4. Firestore Database > Create database.
    */

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      sendEmailVerification,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      increment,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY",
      authDomain: "PASTE_YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "PASTE_YOUR_PROJECT_ID",
      storageBucket: "PASTE_YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",
      appId: "PASTE_YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("registerForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const inviteInput = document.getElementById("inviteCode");
    const registerBtn = document.getElementById("registerBtn");
    const buttonText = document.getElementById("buttonText");
    const toast = document.getElementById("toast");

    const fields = {
      email: document.getElementById("emailField"),
      password: document.getElementById("passwordField"),
      confirmPassword: document.getElementById("confirmPasswordField"),
      invite: document.getElementById("inviteField")
    };

    function showToast(message, type = "success") {
      toast.textContent = message;
      toast.className = `toast ${type} show`;

      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3200);
    }

    function setLoading(isLoading) {
      registerBtn.disabled = isLoading;
      registerBtn.classList.toggle("loading", isLoading);
      buttonText.textContent = isLoading ? "Creating Account..." : "Register";
    }

    function markInvalid(field, invalid) {
      field.classList.toggle("invalid", invalid);
    }

    function validateForm() {
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      const passwordValid = password.length >= 6;
      const confirmValid = confirmPassword === password && confirmPassword.length >= 6;

      markInvalid(fields.email, !emailValid);
      markInvalid(fields.password, !passwordValid);
      markInvalid(fields.confirmPassword, !confirmValid);

      return emailValid && passwordValid && confirmValid;
    }

    async function validateInviteCode(inviteCode) {
      if (!inviteCode) return null;

      const inviteRef = doc(db, "inviteCodes", inviteCode);
      const inviteSnap = await getDoc(inviteRef);

      if (!inviteSnap.exists()) {
        throw new Error("invalid-invite");
      }

      const data = inviteSnap.data();

      if (data.active === false) {
        throw new Error("invalid-invite");
      }

      return {
        ref: inviteRef,
        data
      };
    }

    document.querySelectorAll(".eye-btn").forEach((button) => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.toggle);
        const isHidden = input.type === "password";

        input.type = isHidden ? "text" : "password";
        button.setAttribute(
          "aria-label",
          isHidden ? "Hide password" : "Show password"
        );
      });
    });

    [emailInput, passwordInput, confirmPasswordInput].forEach((input) => {
      input.addEventListener("input", validateForm);
    });

    inviteInput.addEventListener("input", () => {
      inviteInput.value = inviteInput.value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");
      markInvalid(fields.invite, false);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!validateForm()) {
        showToast("Please check the entered details.", "error");
        return;
      }

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;
      const inviteCode = inviteInput.value.trim().toUpperCase();

      setLoading(true);
      markInvalid(fields.invite, false);

      try {
        let inviter = null;

        if (inviteCode) {
          inviter = await validateInviteCode(inviteCode);
        }

        const credential = await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        const user = credential.user;

        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          email,
          balance: 0,
          totalEarnings: 0,
          referralEarnings: 0,
          referredByCode: inviteCode || null,
          ownInviteCode: user.uid.slice(0, 8).toUpperCase(),
          accountStatus: "active",
          role: "user",
          emailVerified: false,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        await setDoc(doc(db, "inviteCodes", user.uid.slice(0, 8).toUpperCase()), {
          ownerUid: user.uid,
          ownerEmail: email,
          active: true,
          totalReferrals: 0,
          createdAt: serverTimestamp()
        });

        if (inviter) {
          await updateDoc(inviter.ref, {
            totalReferrals: increment(1),
            updatedAt: serverTimestamp()
          });

          await setDoc(
            doc(db, "referrals", `${inviteCode}_${user.uid}`),
            {
              inviteCode,
              invitedUserUid: user.uid,
              invitedUserEmail: email,
              referrerUid: inviter.data.ownerUid || null,
              status: "registered",
              rewardGiven: false,
              createdAt: serverTimestamp()
            }
          );
        }

        await sendEmailVerification(user);
        await signOut(auth);

        showToast("Account created. Verification email sent.", "success");
        form.reset();

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1800);

      } catch (error) {
        console.error(error);

        if (error.message === "invalid-invite") {
          markInvalid(fields.invite, true);
          showToast("Invite code is invalid or disabled.", "error");
        } else if (error.code === "auth/email-already-in-use") {
          markInvalid(fields.email, true);
          showToast("This email is already registered.", "error");
        } else if (error.code === "auth/invalid-email") {
          markInvalid(fields.email, true);
          showToast("Please enter a valid email.", "error");
        } else if (error.code === "auth/weak-password") {
          markInvalid(fields.password, true);
          showToast("Please choose a stronger password.", "error");
        } else if (
          error.code === "auth/network-request-failed"
        ) {
          showToast("Network error. Please check your internet.", "error");
        } else if (
          String(error.message).includes("PASTE_YOUR")
        ) {
          showToast("First add your Firebase config in this file.", "error");
        } else {
          showToast(error.message || "Registration failed. Try again.", "error");
        }
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
