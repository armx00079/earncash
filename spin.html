<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spin Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Arial;background:#f3f3f3;text-align:center}
.header{background:#5e239d;color:#fff;padding:15px;font-size:20px}
.card{margin:15px;background:#fff;padding:15px;border-radius:12px}
canvas{margin-top:20px}
button{background:#5e239d;color:#fff;border:none;padding:14px 40px;border-radius:30px;margin-top:20px;font-size:18px}
#popup{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);justify-content:center;align-items:center}
#box{background:#fff;padding:25px;border-radius:15px}
</style>
</head>

<body>

<div class="header">🎡 Spin Wheel</div>

<div class="card">
Wallet: ₹<span id="wallet">0</span><br>
Winning: ₹<span id="winning">0</span>
</div>

<canvas id="wheel" width="300" height="300"></canvas>

<br>
<button id="spinBtn">SPIN</button>

<div id="popup">
<div id="box">
<h2 id="result">₹0</h2>
<p>Result</p>
</div>
</div>
 <script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
updateDoc
} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyBudDcoi0ybnrLpifDJGxYxfdF3eoSpDxM",
authDomain:"earncash7-f0ecc.firebaseapp.com",
projectId:"earncash7-f0ecc",
appId:"1:1017767289580:web:56ecbedc90fe167d3dbbc9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let userRef;
let settings = {};

/* ========= USER LOAD ========= */

onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="index.html";
return;
}

userRef = doc(db,"users",user.uid);

const snap = await getDoc(userRef);

wallet.innerText = snap.data().balance || 0;
winning.innerText = snap.data().totalEarned || 0;

});

/* ========= SETTINGS LOAD ========= */

async function loadSettings(){

const snap = await getDoc(doc(db,"admin","spinControl"));

if(snap.exists()){
settings = snap.data();
}

}

loadSettings();

/* helper */
function rand(min,max){
return Math.floor(Math.random()*(max-min+1))+min;
}spinBtn.onclick = async () => {

const snap = await getDoc(userRef);
let user = snap.data();

if(user.balance < settings.spinCost){
alert("Not enough balance");
return;
}

/* ===== HOUSE EDGE ===== */

let winChance = Math.random()*100;
let reward = 0;

/* LOSS */
if(winChance < settings.houseEdge){
reward = -settings.spinCost;
}

/* WIN */
else{

let r = Math.random()*100;

if(r < settings.smallWinChance){
reward = rand(settings.smallWinMin, settings.smallWinMax);
}
else if(r < settings.smallWinChance + settings.mediumWinChance){
reward = rand(settings.mediumWinMin, settings.mediumWinMax);
}
else{
reward = rand(settings.bigWinMin, settings.bigWinMax);
}

if(reward > settings.maxWin){
reward = settings.maxWin;
}

}

/* animation */
let deg = 1800 + Math.random()*360;
wheel.style.transition="4s";
wheel.style.transform=`rotate(${deg}deg)`;

/* update DB */
await updateDoc(userRef,{
balance:user.balance + reward,
totalEarned:(user.totalEarned||0) + (reward>0?reward:0)
});

/* UI */
setTimeout(async()=>{

let u = await getDoc(userRef);

wallet.innerText = u.data().balance;
winning.innerText = u.data().totalEarned;

result.innerText = "₹"+reward;
popup.style.display="flex";

setTimeout(()=>popup.style.display="none",2000);

},4000);

};
